name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'release, or profile (for measuring speed with DevTools)'
        default: release
        type: choice
        options: [release, profile]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # Every APK is signed with the same key (kept in repository secrets),
      # so each new build installs over the previous one and the user's
      # books and writing are kept.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.NOTS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret NOTS_KEYSTORE_BASE64 is missing: the APK would not update an installed copy."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nots.jks"
          echo "NOTS_KEYSTORE=$RUNNER_TEMP/nots.jks" >> "$GITHUB_ENV"

      # The names and information of the books ship with the app: the current
      # catalogue goes in; when the server cannot be reached, the committed one.
      - name: Current catalogue
        run: |
          curl -fsS -m 60 https://alhikmeh.org/alhawzaapp/publiclibdata/nots/catalog.txt -o catalog.new \
            && grep -q nots-catalog catalog.new && mv catalog.new assets/catalog.txt \
            || echo "::warning::Catalogue not fetched; building with the committed one."

      - run: >-
          flutter build apk --${{ inputs.mode || 'release' }}
          --dart-define=GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          --dart-define=GOOGLE_BROWSER_CLIENT_ID=${{ secrets.GOOGLE_BROWSER_CLIENT_ID }}
          --dart-define=GOOGLE_BROWSER_CLIENT_SECRET=${{ secrets.GOOGLE_BROWSER_CLIENT_SECRET }}
        env:
          NOTS_KEYSTORE_PASSWORD: ${{ secrets.NOTS_KEYSTORE_PASSWORD }}
          NOTS_KEY_ALIAS: nots

      - name: Check the APK is signed with the fixed key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          OUT=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-${{ inputs.mode || 'release' }}.apk 2>&1) || { echo "$OUT"; exit 1; }
          echo "$OUT" | grep -i "certificate DN" || echo "$OUT"
          echo "$OUT" | grep -qi "certificate DN: CN=Nots"

      - uses: actions/upload-artifact@v4
        with:
          name: nots-apk-${{ inputs.mode || 'release' }}
          path: app/build/app/outputs/flutter-apk/app-${{ inputs.mode || 'release' }}.apk
          if-no-files-found: error
