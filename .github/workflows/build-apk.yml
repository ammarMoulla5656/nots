name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # Every APK is signed with the same key (kept in repository secrets),
      # so each new build installs over the previous one and the user's
      # books and writing are kept.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.NOTS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret NOTS_KEYSTORE_BASE64 is missing: the APK would not update an installed copy."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nots.jks"
          echo "NOTS_KEYSTORE=$RUNNER_TEMP/nots.jks" >> "$GITHUB_ENV"

      - run: flutter build apk --release
        env:
          NOTS_KEYSTORE_PASSWORD: ${{ secrets.NOTS_KEYSTORE_PASSWORD }}
          NOTS_KEY_ALIAS: nots

      - name: Check the APK is signed with the fixed key
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          OUT=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk 2>&1) || { echo "$OUT"; exit 1; }
          echo "$OUT" | grep -i "certificate DN" || echo "$OUT"
          echo "$OUT" | grep -qi "certificate DN: CN=Nots"

      - uses: actions/upload-artifact@v4
        with:
          name: nots-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
